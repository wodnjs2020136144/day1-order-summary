plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skala'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 편집기·OS 가 달라도 한글 주석·프롬프트가 깨지지 않게 인코딩을 고정한다.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }
tasks.named('bootRun') { jvmArgs = ['-Dfile.encoding=UTF-8'] }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'   // Swagger UI

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 부터 @WebMvcTest(org.springframework.boot.webmvc.test.autoconfigure) 는
    // spring-boot-starter-test 가 아니라 이 신규 스타터가 있어야 딸려온다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // ===============================
    // Spring AI BOM
    // ===============================
    implementation platform(
        "org.springframework.ai:spring-ai-bom:2.0.0"
    )

    // ===============================
    // Spring AI + OpenAI
    // ===============================
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

}

tasks.named('test') { useJUnitPlatform() }
